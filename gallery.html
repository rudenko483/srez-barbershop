  <main id="main" class="wrap" tabindex="-1">
  <section class="page-lead" aria-labelledby="page-title">
    <h1 id="page-title">Галерея</h1>
    <p>Визуализация студии и документальные кадры стрижки и оформления бороды.</p>
  </section>
  <section class="gallery" aria-label="Кадры галереи" data-gallery>
    <div class="gallery-controls" data-gallery-controls hidden>
      <div class="gallery-choices" role="group" aria-label="Выбрать кадр">
        <button type="button" data-gallery-choice="0">Интерьер</button>
        <button type="button" data-gallery-choice="1">Стрижка</button>
        <button type="button" data-gallery-choice="2">Борода</button>
        <button type="button" data-gallery-choice="3">Инструменты</button>
      </div>
      <div class="gallery-arrows">
        <button type="button" data-gallery-step="-1" aria-label="Предыдущий кадр">←</button>
        <span aria-hidden="true" data-gallery-count></span>
        <button type="button" data-gallery-step="1" aria-label="Следующий кадр">→</button>
      </div>
    </div>
    <div class="gallery-viewport">
      <figure class="photo gallery-slide" data-label="Интерьер">
        <img src="interior.webp" alt="Солнечный свет из окна, чёрное кресло и арочное зеркало." width="1672" height="941" fetchpriority="high">
        <figcaption>Визуализация интерьера «СРЕЗ»</figcaption>
      </figure>
      <figure class="photo gallery-slide" data-label="Стрижка">
        <img src="haircut-nenad.webp" alt="Барбер держит пряди расчёской и стрижёт волосы машинкой." width="960" height="1438" loading="lazy">
        <figcaption class="photo-credit">Фото <a href="https://commons.wikimedia.org/wiki/File:Barber_cutting_hair_with_comb._Back_view_of_young_man_in_barber_shop.jpg">Nenad Stojkovic</a> · <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a></figcaption>
      </figure>
      <figure class="photo gallery-slide" data-label="Борода">
        <img src="beard-trim.webp" alt="Мастер подравнивает бороду триммером." width="1080" height="1080" loading="lazy">
        <figcaption class="photo-credit">Фото <a href="https://hairspies.com/">Hair Spies</a> · <a href="https://commons.wikimedia.org/wiki/File:Beard_trimming_(51211203860).jpg">оригинал</a> · <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a></figcaption>
      </figure>
      <figure class="photo gallery-slide" data-label="Инструменты">
        <img src="tools.webp" alt="Ножницы, расчёска и полотенце в солнечном свете." width="820" height="1024" loading="lazy">
        <figcaption>Визуализация инструментов</figcaption>
      </figure>
    </div>
    <p class="sr-only" role="status" data-gallery-status></p>
  </section>
